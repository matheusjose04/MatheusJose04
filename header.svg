<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matheus José AI DEV Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#071A17"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F5A0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect x="24" y="22" width="1152" height="256" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <rect x="24" y="22" width="1152" height="256" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
  <rect x="24" y="22" width="1152" height="38" rx="18" fill="#0D1117" opacity="0.9"/>
  <line x1="24" y1="60" x2="1176" y2="60" stroke="#30363D"/>

  <circle cx="52" cy="41" r="6" fill="#FF5F56"/>
  <circle cx="74" cy="41" r="6" fill="#FFBD2E"/>
  <circle cx="96" cy="41" r="6" fill="#27C93F"/>

  <text x="124" y="47" font-family="monospace" font-size="14" fill="#8B949E">
    matheus@cyberlab: ~/profile
  </text>

  <g font-family="monospace">
    <text x="66" y="98" font-size="16" fill="#00F5A0">
      &gt; SYSTEM_BOOT
      <animate attributeName="opacity" values="0;1" dur="0.7s" fill="freeze"/>
    </text>

    <text x="66" y="128" font-size="15" fill="#8B949E" opacity="0">
      [OK] loading developer modules...
      <animate attributeName="opacity" values="0;1" begin="0.45s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="66" y="154" font-size="15" fill="#8B949E" opacity="0">
      [OK] loading cybersecurity modules...
      <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="66" y="180" font-size="15" fill="#8B949E" opacity="0">
      [OK] loading AI interface...
      <animate attributeName="opacity" values="0;1" begin="1.35s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="66" y="224" font-size="42" font-weight="700" fill="url(#accent)" filter="url(#glow)">
      MATHEUS JOSÉ
    </text>

    <text x="68" y="253" font-size="15" letter-spacing="3" fill="#C9D1D9">
      AI // DEV // CYBERSECURITY
    </text>
  </g>

  <g clip-path="url(#screen)">
    <rect x="-200" y="64" width="180" height="210" fill="#00F5A0" opacity="0.035" transform="skewX(-12)">
      <animate attributeName="x" from="-220" to="1320" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(1010 140)">
    <circle r="58" fill="none" stroke="#00F5A0" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="35 18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="25" fill="none" stroke="#00F5A0" stroke-width="2" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#00F5A0" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
