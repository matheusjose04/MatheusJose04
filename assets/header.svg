<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Matheus José - AI, Dev and Cybersecurity</title>
  <desc id="desc">Animated GitHub profile header with terminal, cyber security and developer interface elements.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.48" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="80" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#00d4ff;#bc13fe;#00ff88" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.52" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#bc13fe;#00ff88;#00d4ff" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bc13fe">
        <animate attributeName="stop-color" values="#bc13fe;#00ff88;#00d4ff;#bc13fe" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bc13fe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="0.52" stop-color="#00d4ff" stop-opacity="0.72"/>
      <stop offset="0.82" stop-color="#bc13fe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#bc13fe" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="greenGlow" cx="0.25" cy="0.72" r="0.7">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="0.85" cy="0.32" r="0.65">
      <stop offset="0" stop-color="#bc13fe" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bc13fe" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="48" y="38" width="1104" height="244" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#greenGlow)"/>
  <rect width="1200" height="320" fill="url(#purpleGlow)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <path d="M0 82H1200" stroke="url(#lineGradient)" stroke-width="2">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 260H1200" stroke="url(#lineGradient)" stroke-width="2" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="240" dur="6s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.18" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#00ff88">
    <text x="42" y="122">01001001 01010100</text>
    <text x="884" y="74">secure_build=true</text>
    <text x="912" y="286">trace: clean</text>
    <text x="42" y="286">status: online</text>
    <animate attributeName="opacity" values="0.10;0.26;0.10" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="48" y="38" width="1104" height="244" rx="24" fill="#0d1117" fill-opacity="0.78" stroke="#263241" stroke-width="1.5"/>
    <rect x="48" y="38" width="1104" height="42" rx="24" fill="#06090f" fill-opacity="0.9"/>
    <rect x="48" y="62" width="1104" height="18" fill="#06090f" fill-opacity="0.9"/>
    <line x1="48" y1="80" x2="1152" y2="80" stroke="#263241"/>

    <circle cx="76" cy="59" r="6" fill="#ff5f56"/>
    <circle cx="98" cy="59" r="6" fill="#ffbd2e"/>
    <circle cx="120" cy="59" r="6" fill="#27c93f"/>

    <text x="146" y="64" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">matheus@cyberlab: ~/profile</text>
    <circle cx="1016" cy="59" r="4" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1030" y="64" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">SYSTEM ONLINE</text>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="-240" y="82" width="180" height="200" fill="url(#scan)" transform="skewX(-12)">
      <animate attributeName="x" values="-240;1240" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="82" y="122" font-size="15" font-weight="700" fill="#00ff88">&gt; boot_profile --mode=public</text>
    <rect x="82" y="134" width="72" height="3" rx="1.5" fill="#00ff88"/>
    <rect x="164" y="134" width="34" height="3" rx="1.5" fill="#bc13fe"/>
  </g>

  <g>
    <text x="80" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#titleGradient)">MATHEUS JOSÉ</text>
    <text x="84" y="214" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#e6edf3">AI • DEV • CYBERSECURITY</text>
    <text x="84" y="242" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b949e">Computer Science student building, automating and securing systems</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700">
    <rect x="84" y="258" width="74" height="24" rx="12" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.5"/>
    <text x="121" y="274" text-anchor="middle" fill="#00ff88">PYTHON</text>
    <rect x="168" y="258" width="98" height="24" rx="12" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.48"/>
    <text x="217" y="274" text-anchor="middle" fill="#00d4ff">JAVASCRIPT</text>
    <rect x="276" y="258" width="62" height="24" rx="12" fill="#bc13fe" fill-opacity="0.12" stroke="#bc13fe" stroke-opacity="0.5"/>
    <text x="307" y="274" text-anchor="middle" fill="#bc13fe">LINUX</text>
    <rect x="348" y="258" width="88" height="24" rx="12" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.5"/>
    <text x="392" y="274" text-anchor="middle" fill="#00ff88">SECURITY</text>
    <rect x="446" y="258" width="42" height="24" rx="12" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.48"/>
    <text x="467" y="274" text-anchor="middle" fill="#00d4ff">AI</text>
  </g>

  <g transform="translate(950 174)">
    <circle r="78" fill="#06090f" fill-opacity="0.45" stroke="#263241"/>
    <g>
      <circle r="66" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-dasharray="50 26 10 18" opacity="0.72"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="50" fill="none" stroke="#bc13fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="24 16 8 16" opacity="0.78"/>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="11s" repeatCount="indefinite"/>
    </g>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#00ff88" stroke-opacity="0.2"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#00ff88" stroke-opacity="0.2"/>
    <circle r="15" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-opacity="0.55"/>
    <circle r="5" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="0" cy="-50" r="4" fill="#bc13fe" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="11">
    <text x="1048" y="128" fill="#8b949e">FOCUS</text>
    <text x="1132" y="128" text-anchor="end" fill="#00ff88">CYBER</text>
    <text x="1048" y="154" fill="#8b949e">BUILD</text>
    <text x="1132" y="154" text-anchor="end" fill="#e6edf3">ACTIVE</text>
    <text x="1048" y="180" fill="#8b949e">LEARN</text>
    <text x="1132" y="180" text-anchor="end" fill="#00d4ff">DAILY</text>
    <text x="1048" y="206" fill="#8b949e">MODE</text>
    <text x="1132" y="206" text-anchor="end" fill="#bc13fe">OPEN</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="2" opacity="0.82">
    <path d="M54 104H130L154 128H250" stroke="#00ff88" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M652 104H760L784 128H844" stroke="#00d4ff" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M636 262H734L762 238H838" stroke="#bc13fe" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="72" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
