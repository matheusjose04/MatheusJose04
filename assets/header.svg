<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Matheus José - AI, DEV and Cybersecurity</title>
  <desc id="desc">
    GitHub profile banner for Matheus José, Computer Science student,
    interested in development, artificial intelligence and learning cybersecurity.
  </desc>

  <!-- ====================================================== -->
  <!-- DEFINITIONS                                             -->
  <!-- ====================================================== -->

  <defs>

    <!-- Main background -->
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#071A17"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="accentGradient" x1="70" y1="0" x2="700" y2="0">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- HUD accent -->
    <linearGradient id="hudGradient" x1="900" y1="80" x2="1120" y2="230">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Soft green glow -->
    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#00F5A0"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>

    <!-- Dots -->
    <pattern
      id="dots"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="2"
        cy="2"
        r="1"
        fill="#8B949E"
        opacity="0.08"
      />
    </pattern>

    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanner gradient -->
    <linearGradient id="scannerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip everything inside the panel -->
    <clipPath id="panelClip">
      <rect x="22" y="18" width="1156" height="264" rx="18"/>
    </clipPath>

  </defs>

  <!-- ====================================================== -->
  <!-- BACKGROUND                                              -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="300"
    rx="24"
    fill="url(#backgroundGradient)"
  />

  <!-- Background glows -->
  <circle
    cx="135"
    cy="235"
    r="260"
    fill="url(#greenGlow)"
  />

  <circle
    cx="1090"
    cy="80"
    r="250"
    fill="url(#purpleGlow)"
  />

  <!-- Grid -->
  <rect
    width="1200"
    height="300"
    rx="24"
    fill="url(#grid)"
  />

  <!-- Dots -->
  <rect
    width="1200"
    height="300"
    rx="24"
    fill="url(#dots)"
    opacity="0.42"
  />

  <!-- ====================================================== -->
  <!-- OUTER PANEL                                             -->
  <!-- ====================================================== -->

  <rect
    x="22"
    y="18"
    width="1156"
    height="264"
    rx="18"
    fill="#0D1117"
    fill-opacity="0.42"
    stroke="#30363D"
    stroke-width="1.5"
  />

  <!-- Top terminal bar -->
  <rect
    x="22"
    y="18"
    width="1156"
    height="42"
    rx="18"
    fill="#0D1117"
    fill-opacity="0.88"
  />

  <!-- Fix lower corners of terminal bar -->
  <rect
    x="22"
    y="43"
    width="1156"
    height="17"
    fill="#0D1117"
    fill-opacity="0.88"
  />

  <line
    x1="22"
    y1="60"
    x2="1178"
    y2="60"
    stroke="#30363D"
    stroke-width="1"
  />

  <!-- ====================================================== -->
  <!-- TERMINAL TOP BAR                                        -->
  <!-- ====================================================== -->

  <!-- Mac/Linux style dots -->
  <circle cx="50" cy="39" r="5.5" fill="#FF5F56"/>
  <circle cx="69" cy="39" r="5.5" fill="#FFBD2E"/>
  <circle cx="88" cy="39" r="5.5" fill="#27C93F"/>

  <text
    x="112"
    y="44"
    fill="#8B949E"
    font-family="Consolas, 'Courier New', monospace"
    font-size="13"
  >
    matheus@cyberlab: ~/profile
  </text>

  <!-- Top right status -->
  <circle
    cx="1040"
    cy="39"
    r="4"
    fill="#00F5A0"
    filter="url(#smallGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="1052"
    y="44"
    fill="#8B949E"
    font-family="Consolas, 'Courier New', monospace"
    font-size="12"
  >
    SYSTEM // ONLINE
  </text>

  <!-- ====================================================== -->
  <!-- LEFT CONTENT                                            -->
  <!-- ====================================================== -->

  <!-- Small command -->
  <text
    x="72"
    y="105"
    fill="#00F5A0"
    font-family="Consolas, 'Courier New', monospace"
    font-size="14"
    font-weight="600"
  >
    &gt; SYSTEM INITIALIZED
  </text>

  <!-- Small decorative line -->
  <rect
    x="72"
    y="118"
    width="58"
    height="2"
    rx="1"
    fill="#00F5A0"
  />

  <rect
    x="136"
    y="118"
    width="24"
    height="2"
    rx="1"
    fill="#7C3AED"
    opacity="0.8"
  />

  <!-- Main name -->
  <text
    x="70"
    y="169"
    fill="url(#accentGradient)"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="1"
  >
    MATHEUS JOSÉ
  </text>

  <!-- Main subtitle -->
  <text
    x="72"
    y="201"
    fill="#E6EDF3"
    font-family="Consolas, 'Courier New', monospace"
    font-size="17"
    font-weight="600"
    letter-spacing="2"
  >
    AI // DEV // CYBERSECURITY
  </text>

  <!-- Secondary subtitle -->
  <text
    x="72"
    y="227"
    fill="#8B949E"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="13"
    letter-spacing="0.5"
  >
    Computer Science • Technology • Security
  </text>

  <!-- Decorative command block -->
  <rect
    x="72"
    y="242"
    width="560"
    height="1"
    fill="#30363D"
  />

  <text
    x="72"
    y="260"
    fill="#57606A"
    font-family="Consolas, 'Courier New', monospace"
    font-size="10.5"
  >
    learn();
  </text>

  <text
    x="124"
    y="260"
    fill="#00F5A0"
    font-family="Consolas, 'Courier New', monospace"
    font-size="10.5"
  >
    build();
  </text>

  <text
    x="177"
    y="260"
    fill="#7C3AED"
    font-family="Consolas, 'Courier New', monospace"
    font-size="10.5"
  >
    test();
  </text>

  <text
    x="221"
    y="260"
    fill="#8B949E"
    font-family="Consolas, 'Courier New', monospace"
    font-size="10.5"
  >
    secure();
  </text>

  <!-- ====================================================== -->
  <!-- DIVIDER                                                 -->
  <!-- ====================================================== -->

  <line
    x1="805"
    y1="82"
    x2="805"
    y2="247"
    stroke="#30363D"
    stroke-width="1"
    stroke-dasharray="4 7"
  />

  <!-- ====================================================== -->
  <!-- RIGHT HUD                                               -->
  <!-- ====================================================== -->

  <g transform="translate(965 155)">

    <!-- Outer faint circle -->
    <circle
      cx="0"
      cy="0"
      r="79"
      fill="#020617"
      fill-opacity="0.35"
      stroke="#30363D"
      stroke-width="1"
    />

    <!-- Outer rotating segmented ring -->
    <g>
      <circle
        cx="0"
        cy="0"
        r="68"
        fill="none"
        stroke="#00F5A0"
        stroke-opacity="0.55"
        stroke-width="2"
        stroke-dasharray="58 28 12 22"
        stroke-linecap="round"
      />

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="18s"
        repeatCount="indefinite"
      />
    </g>

    <!-- Purple reverse ring -->
    <g>
      <circle
        cx="0"
        cy="0"
        r="54"
        fill="none"
        stroke="#7C3AED"
        stroke-opacity="0.7"
        stroke-width="2"
        stroke-dasharray="22 16 6 14"
        stroke-linecap="round"
      />

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 0 0"
        to="0 0 0"
        dur="13s"
        repeatCount="indefinite"
      />
    </g>

    <!-- Inner circle -->
    <circle
      cx="0"
      cy="0"
      r="37"
      fill="none"
      stroke="#00F5A0"
      stroke-opacity="0.28"
      stroke-width="1.5"
    />

    <!-- Radar lines -->
    <line
      x1="-34"
      y1="0"
      x2="34"
      y2="0"
      stroke="#00F5A0"
      stroke-opacity="0.14"
      stroke-width="1"
    />

    <line
      x1="0"
      y1="-34"
      x2="0"
      y2="34"
      stroke="#00F5A0"
      stroke-opacity="0.14"
      stroke-width="1"
    />

    <!-- Small diagonal marks -->
    <line
      x1="-22"
      y1="-22"
      x2="-14"
      y2="-14"
      stroke="#7C3AED"
      stroke-opacity="0.65"
      stroke-width="1.5"
    />

    <line
      x1="22"
      y1="-22"
      x2="14"
      y2="-14"
      stroke="#7C3AED"
      stroke-opacity="0.65"
      stroke-width="1.5"
    />

    <line
      x1="-22"
      y1="22"
      x2="-14"
      y2="14"
      stroke="#00F5A0"
      stroke-opacity="0.65"
      stroke-width="1.5"
    />

    <line
      x1="22"
      y1="22"
      x2="14"
      y2="14"
      stroke="#00F5A0"
      stroke-opacity="0.65"
      stroke-width="1.5"
    />

    <!-- Center core -->
    <circle
      cx="0"
      cy="0"
      r="14"
      fill="#00F5A0"
      fill-opacity="0.07"
      stroke="#00F5A0"
      stroke-opacity="0.5"
      stroke-width="1.5"
    />

    <circle
      cx="0"
      cy="0"
      r="5"
      fill="#00F5A0"
      filter="url(#smallGlow)"
    >
      <animate
        attributeName="r"
        values="4.5;6;4.5"
        dur="2.2s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.65;1;0.65"
        dur="2.2s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Orbiting point -->
    <g>
      <circle
        cx="0"
        cy="-54"
        r="3.5"
        fill="#7C3AED"
        filter="url(#smallGlow)"
      />

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="7s"
        repeatCount="indefinite"
      />
    </g>

  </g>

  <!-- ====================================================== -->
  <!-- RIGHT STATUS PANEL                                      -->
  <!-- ====================================================== -->

  <g
    font-family="Consolas, 'Courier New', monospace"
    font-size="10.5"
  >

    <!-- System -->
    <circle
      cx="1080"
      cy="102"
      r="3"
      fill="#00F5A0"
    />

    <text
      x="1090"
      y="106"
      fill="#8B949E"
    >
      SYSTEM
    </text>

    <text
      x="1147"
      y="106"
      fill="#00F5A0"
      text-anchor="end"
    >
      ONLINE
    </text>

    <!-- Development -->
    <circle
      cx="1080"
      cy="127"
      r="3"
      fill="#00F5A0"
    />

    <text
      x="1090"
      y="131"
      fill="#8B949E"
    >
      DEV
    </text>

    <text
      x="1147"
      y="131"
      fill="#E6EDF3"
      text-anchor="end"
    >
      ACTIVE
    </text>

    <!-- Security -->
    <circle
      cx="1080"
      cy="152"
      r="3"
      fill="#7C3AED"
    >
      <animate
        attributeName="opacity"
        values="0.45;1;0.45"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="1090"
      y="156"
      fill="#8B949E"
    >
      SECURITY
    </text>

    <text
      x="1147"
      y="156"
      fill="#7C3AED"
      text-anchor="end"
    >
      LEARNING
    </text>

    <!-- AI -->
    <circle
      cx="1080"
      cy="177"
      r="3"
      fill="#00F5A0"
    />

    <text
      x="1090"
      y="181"
      fill="#8B949E"
    >
      AI
    </text>

    <text
      x="1147"
      y="181"
      fill="#E6EDF3"
      text-anchor="end"
    >
      READY
    </text>

  </g>

  <!-- ====================================================== -->
  <!-- SMALL RIGHT TERMINAL DETAILS                            -->
  <!-- ====================================================== -->

  <text
    x="841"
    y="91"
    fill="#57606A"
    font-family="Consolas, 'Courier New', monospace"
    font-size="9"
  >
    MODULE_03
  </text>

  <text
    x="841"
    y="226"
    fill="#57606A"
    font-family="Consolas, 'Courier New', monospace"
    font-size="9"
  >
    STATUS_MONITOR
  </text>

  <!-- ====================================================== -->
  <!-- SCANNER                                                 -->
  <!-- ====================================================== -->

  <g clip-path="url(#panelClip)" opacity="0.7">
    <rect
      x="-250"
      y="61"
      width="170"
      height="200"
      fill="url(#scannerGradient)"
      transform="skewX(-12)"
    >
      <animate
        attributeName="x"
        from="-260"
        to="1350"
        dur="8s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- ====================================================== -->
  <!-- CORNER DECORATIONS                                      -->
  <!-- ====================================================== -->

  <!-- Left bottom -->
  <path
    d="M42 253 V263 H52"
    stroke="#00F5A0"
    stroke-opacity="0.4"
    stroke-width="1.5"
  />

  <!-- Right bottom -->
  <path
    d="M1158 253 V263 H1148"
    stroke="#7C3AED"
    stroke-opacity="0.4"
    stroke-width="1.5"
  />

  <!-- Left top -->
  <path
    d="M42 79 V69 H52"
    stroke="#00F5A0"
    stroke-opacity="0.3"
    stroke-width="1.5"
  />

  <!-- Right top -->
  <path
    d="M1158 79 V69 H1148"
    stroke="#7C3AED"
    stroke-opacity="0.3"
    stroke-width="1.5"
  />

</svg>
